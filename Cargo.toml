[package]
name = "ParkinsonAide"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.28"
egui = "0.28"
cpal = "0.15"
hound = "3.5"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vosk = { version = "0.2", optional = true }
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
tempfile = "3"

[features]
default = ["stt"]
stt = ["vosk"]
